<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App</title>
    <style>
      html { margin: 0; padding: 0; height: 100%; background: #343230; border-radius: 10px; }
      body { margin: 0; padding: 0; height: 100%; background: transparent; }
      #app { height: 100vh; }
      .boot-screen {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #343230;
        border-radius: 10px;
        color: #ebe7e0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .boot-logo {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f7f4ef;
      }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(255, 220, 180, 0.12);
        border-top-color: #d4914a;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen">
        <div class="boot-logo">Sorry</div>
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
