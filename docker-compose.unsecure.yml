# No Caddy. Sorry is exposed on PORT (default 80) over plain HTTP.
# Use this behind your own reverse proxy, or for testing on a local network.
# For voice to work from another machine, set LIVEKIT_URL=ws://HOST_IP:7880
services:
  sorry:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-80}:3000"
    environment:
      - DATABASE_URL=sqlite:./data/data.db
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - SERVER_NAME=${SERVER_NAME:-Sorry Server}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SERVER_PASSWORD=${SERVER_PASSWORD:-}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
    volumes:
      - sorry-data:/app/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-60000:50000-60000/udp"
    volumes:
      - ./livekit.local.yaml:/etc/livekit.yaml

volumes:
  sorry-data:
